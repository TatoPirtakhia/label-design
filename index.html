<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A4 Label Studio</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="node_modules/interactjs/dist/interact.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f2ec;
      --ink: #1d2430;
      --muted: #667085;
      --panel: #fffdf8;
      --line: #d7d2c7;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --accent-soft: #d9f1ec;
      --rose: #b42355;
      --gold: #a16207;
      --blue: #315b9b;
      --paper: #ffffff;
      --label-bg: #ffffff;
      --label-ink: #1d2430;
      --label-border: #c9c3b8;
      --radius: 4px;
      --shadow: 0 16px 40px rgba(29, 36, 48, .13);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(15, 118, 110, .08), transparent 36%),
        linear-gradient(315deg, rgba(180, 35, 85, .07), transparent 32%),
        var(--bg);
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 18px;
      overflow: auto;
      min-height: 0;
    }

    .brandbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: 0;
    }

    .status {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .sections {
      display: grid;
      gap: 14px;
    }

    details {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 8px;
      overflow: clip;
    }

    summary {
      cursor: pointer;
      padding: 12px 14px;
      font-weight: 650;
      list-style-position: inside;
      background: #fbfaf7;
    }

    .fields {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.25;
    }

    input,
    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--ink);
      padding: 8px 10px;
    }

    input[type="color"] {
      padding: 2px;
    }

    input[type="file"] {
      padding: 7px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      background: #ffffff;
    }

    .toggle input {
      width: auto;
      min-height: auto;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .font-size-control {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      gap: 8px;
      align-items: end;
    }

    .font-size-control .btn {
      justify-content: center;
      padding-inline: 0;
      font-size: 18px;
      line-height: 1;
      min-width: 42px;
    }

    .preset-note {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .swatch {
      min-height: 42px;
      border-radius: 6px;
      border: 1px solid var(--line);
      cursor: pointer;
      padding: 6px;
      text-align: left;
      background: var(--panel);
      color: var(--ink);
      font-size: 12px;
    }

    .swatch.active {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .swatch span {
      display: block;
      height: 12px;
      border-radius: 2px;
      margin-bottom: 5px;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      padding: 22px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 16px;
      overflow: hidden;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .metrics {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .metric {
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(215, 210, 199, .95);
      border-radius: 7px;
      padding: 8px 10px;
      min-width: 118px;
    }

    .metric strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 650;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .zoom {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .zoom input {
      width: 150px;
      padding: 0;
    }

    .preview-wrap {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      display: grid;
      place-items: start center;
      padding: 12px;
    }

    .preview-wrap.editor-mode {
      place-items: start center;
    }

    .sheets {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .preview-wrap.editor-mode .sheets {
      gap: 0;
    }

    .sheet {
      position: relative;
      width: var(--page-w, 210mm);
      height: var(--page-h, 297mm);
      background: var(--paper);
      box-shadow: var(--shadow);
      transform-origin: top center;
      overflow: hidden;
      color: var(--label-ink);
    }

    .sheet.editor-sheet {
      width: var(--label-w);
      height: var(--label-h);
    }

    .print-area {
      position: absolute;
      inset: 0;
    }

    .label {
      position: absolute;
      width: var(--label-w);
      height: var(--label-h);
      background: var(--label-bg);
      border: 0.35mm solid var(--label-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-columns: 34% 1fr;
      grid-template-rows: minmax(0, 1fr) auto;
      column-gap: 2.2mm;
      padding: 3mm;
      isolation: isolate;
    }

    .label::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--accent-soft);
      opacity: .55;
      clip-path: polygon(0 0, 42% 0, 28% 100%, 0 100%);
      z-index: -1;
    }

    .image-box {
      grid-row: 1 / 3;
      align-self: stretch;
      border-radius: calc(var(--radius) - 1px);
      background: rgba(255,255,255,.74);
      border: 0.25mm solid color-mix(in srgb, var(--label-border), transparent 30%);
      display: grid;
      place-items: center;
      min-width: 0;
      overflow: hidden;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-placeholder {
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        linear-gradient(135deg, var(--accent), transparent 62%),
        linear-gradient(315deg, var(--rose), transparent 56%),
        #f7faf9;
      opacity: .9;
    }

    .copy {
      min-width: 0;
      display: grid;
      align-content: center;
      gap: 1mm;
    }

    .name {
      font-size: var(--name-size);
      line-height: 1.08;
      font-family: var(--name-font);
      font-style: var(--name-style);
      font-weight: var(--name-weight);
      overflow-wrap: anywhere;
      letter-spacing: 0;
    }

    .sub {
      color: color-mix(in srgb, var(--label-ink), transparent 28%);
      font-size: var(--sub-size);
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .meta {
      display: flex;
      gap: 1.4mm;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 1mm;
      font-size: var(--meta-size);
      line-height: 1;
      color: color-mix(in srgb, var(--label-ink), transparent 12%);
    }

    .price {
      font-size: var(--price-size);
      line-height: 1.05;
      font-weight: 700;
    }

    .barcode-row {
      grid-column: 2;
      align-self: end;
      display: grid;
      gap: .6mm;
      min-width: 0;
    }

    .barcode-row svg {
      width: 100%;
      height: var(--barcode-h);
      display: block;
    }

    .barcode-value {
      font-size: var(--barcode-text-size);
      line-height: 1;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: color-mix(in srgb, var(--label-ink), transparent 18%);
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .label.minimal::before {
      display: none;
    }

    .label.minimal {
      grid-template-columns: 1fr;
      text-align: center;
      padding: 4mm;
      border-style: solid;
    }

    .label.minimal .image-box {
      display: none;
    }

    .label.minimal .barcode-row {
      grid-column: 1;
    }

    .label.luxury {
      grid-template-columns: 1fr;
      text-align: center;
      padding: 4mm;
      border-width: .45mm;
    }

    .label.luxury::before {
      clip-path: none;
      inset: auto 0 0 0;
      height: 4mm;
      opacity: 1;
    }

    .label.luxury .image-box {
      display: none;
    }

    .label.luxury .barcode-row {
      grid-column: 1;
    }

    .label.product {
      grid-template-columns: 40% 1fr;
    }

    .label.ticket {
      grid-template-columns: 1fr 34%;
      padding: 3mm 2.5mm;
      border-style: solid;
    }

    .label.ticket::before {
      clip-path: polygon(70% 0, 100% 0, 100% 100%, 80% 100%);
    }

    .label.ticket .image-box {
      grid-column: 2;
      grid-row: 1 / 3;
    }

    .label.ticket .copy {
      grid-column: 1;
      grid-row: 1;
    }

    .label.ticket .barcode-row {
      grid-column: 1;
      grid-row: 2;
    }

    .label.free {
      display: block;
      padding: 0 !important;
      text-align: initial;
    }

    .label.free .image-box,
    .label.free .barcode-row {
      display: grid;
    }

    .label.free .label-item {
      position: absolute;
      left: var(--item-x);
      top: var(--item-y);
      width: var(--item-w);
      height: var(--item-h);
      min-width: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    .label.free .label-item.hidden {
      display: none;
    }

    .label.free .label-item:active {
      cursor: grabbing;
    }

    .label.free .label-item.is-selected {
      outline: .45mm solid var(--accent);
      outline-offset: .45mm;
    }

    .label.free .copy,
    .label.free .meta,
    .label.free .barcode-row {
      display: block;
      margin: 0;
    }

    .label.free .image-box {
      border-radius: calc(var(--radius) - 1px);
    }

    .label.free .barcode-row svg {
      height: calc(100% - 3mm);
    }

    .label.free .barcode-value {
      height: 3mm;
    }

    .editor-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, color-mix(in srgb, var(--label-border), transparent 74%) 1px, transparent 1px),
        linear-gradient(to bottom, color-mix(in srgb, var(--label-border), transparent 74%) 1px, transparent 1px);
      background-size: 5mm 5mm;
      opacity: .65;
      z-index: 4;
    }

    .editor-label {
      box-shadow: 0 0 0 .8mm color-mix(in srgb, var(--accent), transparent 70%);
    }

    .error {
      color: #b42318;
      min-height: 18px;
      font-size: 13px;
      margin-top: 10px;
    }

    @media (max-width: 720px) {
      .app {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      body {
        overflow: auto;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
        overflow: visible;
      }

      .workspace {
        padding: 14px;
        overflow: visible;
      }
    }

    @media (max-width: 560px) {
      .grid-2,
      .grid-3,
      .swatches {
        grid-template-columns: 1fr;
      }

      .brandbar,
      .topline {
        align-items: stretch;
      }

      .actions,
      .metrics,
      .zoom {
        justify-content: flex-start;
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: var(--page-w, 210mm);
        min-height: var(--page-h, 297mm);
        height: auto;
        margin: 0 !important;
        padding: 0 !important;
        background: #fff;
        overflow: visible;
      }

      .sidebar,
      .topline {
        display: none;
      }

      .app,
      .workspace,
      .preview-wrap,
      .sheets {
        display: block;
        width: var(--page-w, 210mm);
        min-height: var(--page-h, 297mm);
        height: auto;
        padding: 0;
        margin: 0 !important;
        overflow: visible;
      }

      .sheet {
        position: relative;
        left: 0;
        top: 0;
        width: var(--page-w, 210mm) !important;
        height: var(--page-h, 297mm) !important;
        transform: translate(var(--print-offset-x, 0mm), var(--print-offset-y, 0mm)) !important;
        box-shadow: none;
        margin: 0 !important;
        overflow: hidden;
        break-after: page;
        page-break-after: always;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .sheet:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .label {
        border-color: transparent !important;
      }

      .editor-grid,
      .editor-label {
        box-shadow: none !important;
      }

      .editor-grid {
        display: none !important;
      }

      .label.free .label-item.is-selected {
        outline: 0 !important;
      }
    }
  </style>
  <style id="printPageStyle">
    @page {
      size: 210mm 297mm;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brandbar">
        <div>
          <h1>A4 Label Studio</h1>
          <div class="status" id="statusText">ფურცლის და ეტიკეტების ზუსტი პრივიუ მილიმეტრებში</div>
        </div>
        <div class="actions">
          <button class="btn primary" type="button" id="printBtn">ბეჭდვა</button>
        </div>
      </div>

      <div class="sections">
        <details open>
          <summary>პროდუქტები და სტილები</summary>
          <div class="fields">
            <label>აირჩიე პროდუქტი
              <select id="productSelect"></select>
            </label>
            <label>პროდუქტის სახელი
              <input id="productName" type="text" value="ჩემი პროდუქტი">
            </label>
            <label>დასაბეჭდი რაოდენობა
              <input id="labelQuantity" type="number" min="1" max="10000" step="1" value="21">
            </label>
            <div class="button-row">
              <button class="btn primary" type="button" id="saveProductBtn">პროდუქტის დამატება</button>
              <button class="btn" type="button" id="updateProductBtn">პროდუქტის განახლება</button>
              <button class="btn" type="button" id="deleteProductBtn">პროდუქტის წაშლა</button>
            </div>
            <div class="preset-note" id="productNote" aria-live="polite"></div>
            <hr>
            <label>აირჩიე შენახული სტილი
              <select id="presetSelect"></select>
            </label>
            <label>სტილის სახელი
              <input id="presetName" type="text" value="ჩემი სტილი">
            </label>
            <div class="button-row">
              <button class="btn primary" type="button" id="savePresetBtn">ახლის დამატება</button>
              <button class="btn" type="button" id="updatePresetBtn">არჩეულის განახლება</button>
              <button class="btn" type="button" id="deletePresetBtn">წაშლა</button>
            </div>
            <div class="preset-note" id="presetNote" aria-live="polite"></div>
          </div>
        </details>

        <details open>
          <summary>ფურცელი და ზომები</summary>
          <div class="fields">
            <div class="grid-2">
              <label>ფურცლის სიგანე, მმ
                <input id="pageWidth" type="number" min="20" max="1000" step="0.1" value="210">
              </label>
              <label>ფურცლის სიმაღლე, მმ
                <input id="pageHeight" type="number" min="20" max="1000" step="0.1" value="297">
              </label>
            </div>
            <div class="grid-2">
              <label>მარცხენა კიდე, მმ
                <input id="marginLeft" type="number" min="0" step="0.1" value="8">
              </label>
              <label>ზედა კიდე, მმ
                <input id="marginTop" type="number" min="0" step="0.1" value="12">
              </label>
              <label>მარჯვენა კიდე, მმ
                <input id="marginRight" type="number" min="0" step="0.1" value="8">
              </label>
              <label>ქვედა კიდე, მმ
                <input id="marginBottom" type="number" min="0" step="0.1" value="12">
              </label>
            </div>
            <div class="grid-2">
              <label>ეტიკეტის სიგანე, მმ
                <input id="labelWidth" type="number" min="10" step="0.1" value="63.5">
              </label>
              <label>ეტიკეტის სიმაღლე, მმ
                <input id="labelHeight" type="number" min="10" step="0.1" value="38.1">
              </label>
              <label>ჰორიზ. დაშორება, მმ
                <input id="gapX" type="number" min="0" step="0.1" value="2.5">
              </label>
              <label>ვერტ. დაშორება, მმ
                <input id="gapY" type="number" min="0" step="0.1" value="2.5">
              </label>
            </div>
            <div class="grid-2">
              <label>სვეტები
                <input id="cols" type="number" min="1" max="10" step="1" value="3">
              </label>
              <label>რიგები
                <input id="rows" type="number" min="1" max="20" step="1" value="7">
              </label>
            </div>
            <label class="toggle">
              <span>ავტომატურად დათვლა</span>
              <input id="autoGrid" type="checkbox" checked>
            </label>
            <label>ბადის განლაგება
              <select id="gridAlign">
                <option value="stretch" selected>გაშლა მარჯვნივ/ქვემოთ</option>
                <option value="center">ცენტრში</option>
                <option value="left">მარცხნიდან/ზემოდან</option>
              </select>
            </label>
            <div class="grid-2">
              <label>ბეჭდვის X ოფსეტი, მმ
                <input id="printOffsetX" type="number" min="-20" max="20" step="0.1" value="0">
              </label>
              <label>ბეჭდვის Y ოფსეტი, მმ
                <input id="printOffsetY" type="number" min="-20" max="20" step="0.1" value="0">
              </label>
            </div>
          </div>
        </details>

        <details open>
          <summary>აწყობა და დეტალები</summary>
          <div class="fields">
            <label>სანახავი რეჟიმი
              <select id="previewMode">
                <option value="all">ყველა ეტიკეტი</option>
                <option value="editor">ერთი ეტიკეტის აწყობა</option>
              </select>
            </label>

        <details open>

            <div class="font-size-control">
              <button class="btn" type="button" id="priceSizeDown" aria-label="ფასის ფონტის დაპატარავება">-</button>
              <label>ფასის ზომა, მმ
                <input id="priceSize" type="number" min="2" max="18" step="0.5" value="3">

              <input id="imageInput" type="file" accept="image/*">

              <select id="style">
                <option value="product">პროდუქტის ფოტო</option>

              <button class="swatch" type="button" data-palette="rose"><span style="background:#b42355"></span>Rose</button>

              </label>

                <input id="radius" type="number" min="0" max="12" step="0.5" value="3">
              </label>
              <label>შიდა დაშორება, მმ

    <section class="workspace" aria-label="პრივიუ">
      <div class="topline">
        <div class="metrics" aria-live="polite">
          <div class="metric"><strong id="countMetric">21</strong><span>დასაბეჭდი რაოდენობა</span></div>
          <div class="metric"><strong id="sizeMetric">63.5 × 38.1</strong><span>ეტიკეტი მმ</span></div>
          <div class="metric"><strong id="gridMetric">3 × 7</strong><span>ბადე და გვერდები</span></div>
        </div>
        <label class="zoom">ზუმი
          <input id="zoom" type="range" min="35" max="100" step="1" value="64">
          <span id="zoomValue">64%</span>

      <div class="preview-wrap" id="previewWrap">
        <div class="sheets" id="sheetsHost">
          <div class="sheet" id="sheet" aria-label="label sheet preview">
            <div class="print-area" id="printArea"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_PAGE = { width: 210, height: 297 };
    const fields = {
      pageWidth: document.getElementById("pageWidth"),
      pageHeight: document.getElementById("pageHeight"),
      marginLeft: document.getElementById("marginLeft"),
      marginTop: document.getElementById("marginTop"),
      marginRight: document.getElementById("marginRight"),
      marginBottom: document.getElementById("marginBottom"),
      labelWidth: document.getElementById("labelWidth"),
      labelHeight: document.getElementById("labelHeight"),
      gapX: document.getElementById("gapX"),
      gapY: document.getElementById("gapY"),
      cols: document.getElementById("cols"),
      rows: document.getElementById("rows"),
      autoGrid: document.getElementById("autoGrid"),
      gridAlign: document.getElementById("gridAlign"),
      printOffsetX: document.getElementById("printOffsetX"),
      printOffsetY: document.getElementById("printOffsetY"),
      previewMode: document.getElementById("previewMode"),
      freeLayout: document.getElementById("freeLayout"),
      activeElement: document.getElementById("activeElement"),
      elemX: document.getElementById("elemX"),
      elemY: document.getElementById("elemY"),
      elemW: document.getElementById("elemW"),
      elemH: document.getElementById("elemH"),
      elemVisible: document.getElementById("elemVisible"),
      productSelect: document.getElementById("productSelect"),
      productName: document.getElementById("productName"),
      labelQuantity: document.getElementById("labelQuantity"),
      presetSelect: document.getElementById("presetSelect"),
      presetName: document.getElementById("presetName"),
      brandName: document.getElementById("brandName"),
      titleSize: document.getElementById("titleSize"),
      titleFont: document.getElementById("titleFont"),
      titleStyle: document.getElementById("titleStyle"),
      subtitle: document.getElementById("subtitle"),
      price: document.getElementById("price"),
      priceSize: document.getElementById("priceSize"),
      sku: document.getElementById("sku"),
      barcodeValue: document.getElementById("barcodeValue"),
      barcodeFormat: document.getElementById("barcodeFormat"),
      barcodeHeight: document.getElementById("barcodeHeight"),
      showBarcode: document.getElementById("showBarcode"),
      style: document.getElementById("style"),
      imageInput: document.getElementById("imageInput"),
      accentColor: document.getElementById("accentColor"),
      labelBg: document.getElementById("labelBg"),
      labelInk: document.getElementById("labelInk"),
      radius: document.getElementById("radius"),
      padding: document.getElementById("padding"),
      zoom: document.getElementById("zoom")
    };

    const sheet = document.getElementById("sheet");
    const printPageStyle = document.getElementById("printPageStyle");
    const previewWrap = document.getElementById("previewWrap");
    const sheetsHost = document.getElementById("sheetsHost");
    const printArea = document.getElementById("printArea");
    const errorText = document.getElementById("errorText");
    const statusText = document.getElementById("statusText");
    const countMetric = document.getElementById("countMetric");
    const sizeMetric = document.getElementById("sizeMetric");
    const gridMetric = document.getElementById("gridMetric");
    const zoomValue = document.getElementById("zoomValue");
    const presetNote = document.getElementById("presetNote");
    const productNote = document.getElementById("productNote");
    const productButtons = {
      save: document.getElementById("saveProductBtn"),
      update: document.getElementById("updateProductBtn"),
      delete: document.getElementById("deleteProductBtn")
    };
    const presetButtons = {
      save: document.getElementById("savePresetBtn"),
      update: document.getElementById("updatePresetBtn"),
      delete: document.getElementById("deletePresetBtn")
    };
    const titleSizeButtons = {
      down: document.getElementById("titleSizeDown"),
      up: document.getElementById("titleSizeUp")
    };
    const priceSizeButtons = {
      down: document.getElementById("priceSizeDown"),
      up: document.getElementById("priceSizeUp")
    };
    let uploadedImage = "";
    let activeProductId = "";
    let activePresetId = "";
    let selectedElementId = "image";
    let interactReady = false;

    const elementDefaults = {
      image: { x: 3, y: 3, w: 18, h: 18, visible: true },
      name: { x: 24, y: 4, w: 36, h: 10, visible: true },
      subtitle: { x: 24, y: 15, w: 36, h: 6, visible: true },
      price: { x: 24, y: 22, w: 14, h: 5, visible: true },
      sku: { x: 40, y: 22, w: 20, h: 5, visible: true },
      barcode: { x: 24, y: 28, w: 34, h: 8, visible: true }
    };
    let elementLayout = JSON.parse(JSON.stringify(elementDefaults));

    const palettes = {
      teal: { accent: "#0f766e", soft: "#d9f1ec", ink: "#1d2430" },
      rose: { accent: "#b42355", soft: "#f7d7e3", ink: "#24151c" },
      gold: { accent: "#a16207", soft: "#f6e7bf", ink: "#221b10" }
    };

    const PRESET_STORAGE_KEY = "a4-label-studio-presets";
    const ACTIVE_PRESET_KEY = "a4-label-studio-active-preset";
    const PRODUCT_STORAGE_KEY = "a4-label-studio-products";
    const ACTIVE_PRODUCT_KEY = "a4-label-studio-active-product";
    const productFieldIds = ["labelQuantity", "brandName", "subtitle", "price", "sku", "barcodeValue", "barcodeFormat"];
    const presetFieldIds = [
      "pageWidth", "pageHeight",
      "marginLeft", "marginTop", "marginRight", "marginBottom",
      "labelWidth", "labelHeight", "gapX", "gapY", "cols", "rows", "autoGrid",
      "gridAlign",
      "printOffsetX", "printOffsetY",
      "previewMode", "freeLayout",
      "titleSize", "titleFont", "titleStyle", "priceSize",
      "barcodeHeight", "showBarcode",
      "style", "accentColor", "labelBg", "labelInk", "radius", "padding"
    ];
    const defaultProducts = [
      {
        id: "sample-product",
        name: "NOVA სანთელი",
        values: {
          brandName: "NOVA Atelier",
          subtitle: "ხელნაკეთი სანთელი | ვანილი და ქარვა",
          price: "₾24.90",
          sku: "SKU-0426",
          barcodeValue: "4860100426003",
          barcodeFormat: "CODE128",
          labelQuantity: "21",
          uploadedImage: ""
        }
      }
    ];

    const defaultPresets = [
      {
        id: "product-teal",
        name: "პროდუქტის Teal",
        values: {
          pageWidth: "210", pageHeight: "297",
          marginLeft: "8", marginTop: "12", marginRight: "8", marginBottom: "12",
          labelWidth: "63.5", labelHeight: "38.1", gapX: "2.5", gapY: "2.5",
          cols: "3", rows: "7", autoGrid: true,
          gridAlign: "stretch",
          printOffsetX: "0", printOffsetY: "0",
          previewMode: "all", freeLayout: false,
          titleSize: "8", titleFont: "Segoe UI, system-ui, sans-serif", titleStyle: "bold", priceSize: "3",
          barcodeFormat: "CODE128", barcodeHeight: "9", showBarcode: true,
          style: "product", accentColor: "#0f766e", labelBg: "#ffffff",
          labelInk: "#1d2430", radius: "3", padding: "3"
        }
      },
      {
        id: "clean-premium",
        name: "სუფთა პრემიუმი",
        values: {
          pageWidth: "210", pageHeight: "297",
          marginLeft: "10", marginTop: "14", marginRight: "10", marginBottom: "14",
          labelWidth: "60", labelHeight: "35", gapX: "4", gapY: "4",
          cols: "3", rows: "7", autoGrid: true,
          gridAlign: "stretch",
          printOffsetX: "0", printOffsetY: "0",
          previewMode: "all", freeLayout: false,
          titleSize: "7.5", titleFont: "Georgia, Times New Roman, serif", titleStyle: "boldItalic", priceSize: "3.2",
          barcodeFormat: "EAN13", barcodeHeight: "8", showBarcode: true,
          style: "luxury", accentColor: "#a16207", labelBg: "#fffdf8",
          labelInk: "#221b10", radius: "2", padding: "4"
        }
      }
    ];
    let products = readProducts();
    let stylePresets = readPresets();

    function num(id) {
      const value = Number(fields[id].value);
      return Number.isFinite(value) ? value : 0;
    }

    function escapeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function pageSize() {
      return {
        width: Math.max(20, num("pageWidth") || DEFAULT_PAGE.width),
        height: Math.max(20, num("pageHeight") || DEFAULT_PAGE.height)
      };
    }

    function cloneLayout(layout) {
      const merged = JSON.parse(JSON.stringify(elementDefaults));
      Object.entries(layout || {}).forEach(([id, value]) => {
        merged[id] = { ...merged[id], ...value };
      });
      return merged;
    }

    function activeLayout() {
      if (!elementLayout[selectedElementId]) {
        elementLayout[selectedElementId] = cloneLayout(elementDefaults)[selectedElementId];
      }
      return elementLayout[selectedElementId];
    }

    function syncElementControls() {
      selectedElementId = fields.activeElement.value;
      const item = activeLayout();
      fields.elemX.value = Number(item.x).toFixed(1);
      fields.elemY.value = Number(item.y).toFixed(1);
      fields.elemW.value = Number(item.w).toFixed(1);
      fields.elemH.value = Number(item.h).toFixed(1);
      fields.elemVisible.checked = item.visible !== false;
    }

    function updateActiveLayoutFromControls() {
      const g = gridFromMeasurements();
      const item = activeLayout();
      item.w = clamp(num("elemW"), 2, g.w);
      item.h = clamp(num("elemH"), 2, g.h);
      item.x = clamp(num("elemX"), 0, Math.max(0, g.w - item.w));
      item.y = clamp(num("elemY"), 0, Math.max(0, g.h - item.h));
      item.visible = fields.elemVisible.checked;
      syncElementControls();
    }

    function fitLayoutToLabel(layout, g) {
      const fitted = cloneLayout(layout);
      Object.values(fitted).forEach(item => {
        item.w = clamp(Number(item.w) || 2, 2, g.w);
        item.h = clamp(Number(item.h) || 2, 2, g.h);
        item.x = clamp(Number(item.x) || 0, 0, Math.max(0, g.w - item.w));
        item.y = clamp(Number(item.y) || 0, 0, Math.max(0, g.h - item.h));
        item.visible = item.visible !== false;
      });
      return fitted;
    }

    function isFreeLayout() {
      return fields.freeLayout.checked || fields.previewMode.value === "editor";
    }

    function readPresets() {
      try {
        const saved = JSON.parse(window.localStorage.getItem(PRESET_STORAGE_KEY) || "[]");
        if (Array.isArray(saved) && saved.length) {
          return saved.filter(preset => preset && preset.id && preset.name && preset.values);
        }
      } catch (error) {
        window.localStorage.removeItem(PRESET_STORAGE_KEY);
      }
      return defaultPresets;
    }

    function readProducts() {
      try {
        const saved = JSON.parse(window.localStorage.getItem(PRODUCT_STORAGE_KEY) || "[]");
        if (Array.isArray(saved) && saved.length) {
          return saved.filter(product => product && product.id && product.name && product.values);
        }
      } catch (error) {
        window.localStorage.removeItem(PRODUCT_STORAGE_KEY);
      }
      return defaultProducts;
    }

    function writePresets() {
      window.localStorage.setItem(PRESET_STORAGE_KEY, JSON.stringify(stylePresets));
    }

    function writeProducts() {
      window.localStorage.setItem(PRODUCT_STORAGE_KEY, JSON.stringify(products));
    }

    function fieldValue(id) {
      const field = fields[id];
      return field.type === "checkbox" ? field.checked : field.value;
    }

    function setFieldValue(id, value) {
      const field = fields[id];
      if (!field) return;
      if (field.type === "checkbox") {
        field.checked = Boolean(value);
      } else if (value !== undefined && value !== null) {
        field.value = value;
      }
    }

    function currentPresetValues() {
      const values = presetFieldIds.reduce((result, id) => {
        result[id] = fieldValue(id);
        return result;
      }, {});
      values.elementLayout = cloneLayout(elementLayout);
      return values;
    }

    function currentProductValues() {
      const values = productFieldIds.reduce((result, id) => {
        result[id] = fieldValue(id);
        return result;
      }, {});
      values.uploadedImage = uploadedImage;
      return values;
    }

    function makePresetId(name) {
      const slug = String(name || "style")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      return `${slug || "style"}-${Date.now().toString(36)}`;
    }

    function populatePresetSelect() {
      fields.presetSelect.innerHTML = stylePresets
        .map(preset => `<option value="${escapeText(preset.id)}">${escapeText(preset.name)}</option>`)
        .join("");
      if (!stylePresets.some(preset => preset.id === activePresetId)) {
        activePresetId = stylePresets[0]?.id || "";
      }
      fields.presetSelect.value = activePresetId;
      const selected = stylePresets.find(preset => preset.id === activePresetId);
      fields.presetName.value = selected?.name || "ჩემი სტილი";
      presetButtons.update.disabled = !selected;
      presetButtons.delete.disabled = stylePresets.length <= 1;
    }

    function populateProductSelect() {
      fields.productSelect.innerHTML = products
        .map(product => `<option value="${escapeText(product.id)}">${escapeText(product.name)}</option>`)
        .join("");
      if (!products.some(product => product.id === activeProductId)) {
        activeProductId = products[0]?.id || "";
      }
      fields.productSelect.value = activeProductId;
      const selected = products.find(product => product.id === activeProductId);
      fields.productName.value = selected?.name || "ჩემი პროდუქტი";
      productButtons.update.disabled = !selected;
      productButtons.delete.disabled = products.length <= 1;
    }

    function syncPaletteButtons() {
      document.querySelectorAll(".swatch").forEach(button => {
        const selected = palettes[button.dataset.palette];
        button.classList.toggle("active", selected && selected.accent.toLowerCase() === fields.accentColor.value.toLowerCase());
      });
    }

    function applyPreset(id, showNote = true) {
      const preset = stylePresets.find(item => item.id === id);
      if (!preset) return;
      activePresetId = preset.id;
      window.localStorage.setItem(ACTIVE_PRESET_KEY, activePresetId);
      presetFieldIds.forEach(fieldId => setFieldValue(fieldId, preset.values[fieldId]));
      elementLayout = fitLayoutToLabel(preset.values.elementLayout || elementDefaults, gridFromMeasurements());
      syncElementControls();
      populatePresetSelect();
      syncPaletteButtons();
      render();
      if (showNote) {
        presetNote.textContent = `"${preset.name}" არჩეულია.`;
      }
    }

    function applyProduct(id, showNote = true) {
      const product = products.find(item => item.id === id);
      if (!product) return;
      activeProductId = product.id;
      window.localStorage.setItem(ACTIVE_PRODUCT_KEY, activeProductId);
      productFieldIds.forEach(fieldId => setFieldValue(fieldId, product.values[fieldId]));
      setFieldValue("labelQuantity", product.values.labelQuantity ?? "21");
      uploadedImage = product.values.uploadedImage || "";
      populateProductSelect();
      render();
      if (showNote) {
        productNote.textContent = `"${product.name}" არჩეულია.`;
      }
    }

    function saveProduct() {
      const name = fields.productName.value.trim() || fields.brandName.value.trim() || "ჩემი პროდუქტი";
      const product = { id: makePresetId(name), name, values: currentProductValues() };
      products.push(product);
      activeProductId = product.id;
      window.localStorage.setItem(ACTIVE_PRODUCT_KEY, activeProductId);
      writeProducts();
      populateProductSelect();
      productNote.textContent = `"${name}" დაემატა.`;
    }

    function updateProduct() {
      const product = products.find(item => item.id === activeProductId);
      if (!product) return;
      const name = fields.productName.value.trim() || product.name;
      product.name = name;
      product.values = currentProductValues();
      window.localStorage.setItem(ACTIVE_PRODUCT_KEY, activeProductId);
      writeProducts();
      populateProductSelect();
      productNote.textContent = `"${name}" განახლდა.`;
    }

    function deleteProduct() {
      if (products.length <= 1) {
        productNote.textContent = "ბოლო პროდუქტს ვერ წავშლით.";
        return;
      }
      const removed = products.find(item => item.id === activeProductId);
      products = products.filter(item => item.id !== activeProductId);
      activeProductId = products[0]?.id || "";
      window.localStorage.setItem(ACTIVE_PRODUCT_KEY, activeProductId);
      writeProducts();
      populateProductSelect();
      applyProduct(activeProductId, false);
      productNote.textContent = removed ? `"${removed.name}" წაიშალა.` : "პროდუქტი წაიშალა.";
    }

    function savePreset() {
      const name = fields.presetName.value.trim() || "ჩემი სტილი";
      const preset = { id: makePresetId(name), name, values: currentPresetValues() };
      stylePresets.push(preset);
      activePresetId = preset.id;
      window.localStorage.setItem(ACTIVE_PRESET_KEY, activePresetId);
      writePresets();
      populatePresetSelect();
      presetNote.textContent = `"${name}" დაემატა.`;
    }

    function updatePreset() {
      const preset = stylePresets.find(item => item.id === activePresetId);
      if (!preset) return;
      const name = fields.presetName.value.trim() || preset.name;
      preset.name = name;
      preset.values = currentPresetValues();
      window.localStorage.setItem(ACTIVE_PRESET_KEY, activePresetId);
      writePresets();
      populatePresetSelect();
      presetNote.textContent = `"${name}" განახლდა.`;
    }

    function deletePreset() {
      if (stylePresets.length <= 1) {
        presetNote.textContent = "ბოლო სტილს ვერ წავშლით.";
        return;
      }
      const removed = stylePresets.find(item => item.id === activePresetId);
      stylePresets = stylePresets.filter(item => item.id !== activePresetId);
      activePresetId = stylePresets[0]?.id || "";
      window.localStorage.setItem(ACTIVE_PRESET_KEY, activePresetId);
      writePresets();
      populatePresetSelect();
      applyPreset(activePresetId, false);
      presetNote.textContent = removed ? `"${removed.name}" წაიშალა.` : "სტილი წაიშალა.";
    }

    function gridFromMeasurements() {
      const page = pageSize();
      const usableW = page.width - num("marginLeft") - num("marginRight");
      const usableH = page.height - num("marginTop") - num("marginBottom");
      const w = Math.max(1, num("labelWidth"));
      const h = Math.max(1, num("labelHeight"));
      const gapX = Math.max(0, num("gapX"));
      const gapY = Math.max(0, num("gapY"));
      const autoCols = Math.floor((usableW + gapX) / (w + gapX));
      const autoRows = Math.floor((usableH + gapY) / (h + gapY));
      const cols = fields.autoGrid.checked ? autoCols : Math.max(1, Math.floor(num("cols")));
      const rows = fields.autoGrid.checked ? autoRows : Math.max(1, Math.floor(num("rows")));
      return { pageW: page.width, pageH: page.height, usableW, usableH, w, h, gapX, gapY, cols: clamp(cols, 0, 100), rows: clamp(rows, 0, 100) };
    }

    function distributedAxis(start, end, available, itemSize, itemCount, gap, align) {
      const gaps = Math.max(0, itemCount - 1);
      const baseUsed = itemCount * itemSize + gaps * gap;
      const leftover = available - baseUsed;
      let renderedStart = start;
      let renderedGap = gap;

      if (leftover > 0 && align === "center") {
        renderedStart = start + leftover / 2;
      }

      if (leftover > 0 && align === "stretch") {
        if (gaps > 0 && gap > 0) {
          renderedGap = gap + leftover / gaps;
        } else if (gaps === 0) {
          renderedStart = start + leftover / 2;
        }
      }

      return {
        start: renderedStart,
        gap: renderedGap,
        used: baseUsed,
        renderedEnd: itemCount > 0 ? renderedStart + itemCount * itemSize + gaps * renderedGap : end
      };
    }

    function sheetDistribution(g) {
      const align = fields.gridAlign.value || "stretch";
      return {
        x: distributedAxis(num("marginLeft"), g.pageW - num("marginRight"), g.usableW, g.w, g.cols, g.gapX, align),
        y: distributedAxis(num("marginTop"), g.pageH - num("marginBottom"), g.usableH, g.h, g.rows, g.gapY, align)
      };
    }

    function applySizingVars(g) {
      const shortest = Math.min(g.w, g.h);
      const titleStyles = {
        regular: { weight: "500", style: "normal" },
        bold: { weight: "700", style: "normal" },
        italic: { weight: "500", style: "italic" },
        boldItalic: { weight: "700", style: "italic" }
      };
      const titleStyle = titleStyles[fields.titleStyle.value] || titleStyles.bold;
      const rootStyle = document.documentElement.style;
      rootStyle.setProperty("--page-w", `${g.pageW}mm`);
      rootStyle.setProperty("--page-h", `${g.pageH}mm`);
      if (printPageStyle) {
        printPageStyle.textContent = `@page { size: ${g.pageW}mm ${g.pageH}mm; margin: 0; }`;
      }
      rootStyle.setProperty("--label-w", `${g.w}mm`);
      rootStyle.setProperty("--label-h", `${g.h}mm`);
      rootStyle.setProperty("--print-offset-x", `${num("printOffsetX")}mm`);
      rootStyle.setProperty("--print-offset-y", `${num("printOffsetY")}mm`);
      rootStyle.setProperty("--name-size", `${clamp(num("titleSize"), 3, 24)}mm`);
      rootStyle.setProperty("--name-font", fields.titleFont.value);
      rootStyle.setProperty("--name-weight", titleStyle.weight);
      rootStyle.setProperty("--name-style", titleStyle.style);
      rootStyle.setProperty("--sub-size", `${clamp(shortest * 0.07, 2.2, 4)}mm`);
      rootStyle.setProperty("--meta-size", `${clamp(shortest * 0.07, 2.2, 3.5)}mm`);
      rootStyle.setProperty("--price-size", `${clamp(num("priceSize"), 2, 18)}mm`);
      rootStyle.setProperty("--barcode-text-size", `${clamp(shortest * 0.055, 1.8, 3)}mm`);
      rootStyle.setProperty("--barcode-h", `${num("barcodeHeight")}mm`);
      rootStyle.setProperty("--label-bg", fields.labelBg.value);
      rootStyle.setProperty("--label-ink", fields.labelInk.value);
      rootStyle.setProperty("--label-border", fields.accentColor.value);
      rootStyle.setProperty("--accent", fields.accentColor.value);
      rootStyle.setProperty("--accent-soft", mix(fields.accentColor.value, "#ffffff", .78));
      rootStyle.setProperty("--radius", `${num("radius")}mm`);
    }

    function mix(hexA, hexB, amount) {
      const a = hexToRgb(hexA);
      const b = hexToRgb(hexB);
      const c = a.map((part, i) => Math.round(part * (1 - amount) + b[i] * amount));
      return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
    }

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      const value = parseInt(normalized.length === 3
        ? normalized.split("").map(ch => ch + ch).join("")
        : normalized, 16);
      return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
    }

    function itemStyle(id) {
      const item = elementLayout[id] || elementDefaults[id];
      return `--item-x:${item.x}mm;--item-y:${item.y}mm;--item-w:${item.w}mm;--item-h:${item.h}mm`;
    }

    function selectedClass(id, editable) {
      return editable && id === selectedElementId ? " is-selected" : "";
    }

    function renderFreeLabel(index, x, y, editable = false) {
      const style = fields.style.value;
      const img = uploadedImage
        ? `<img src="${uploadedImage}" alt="">`
        : `<div class="image-placeholder" aria-hidden="true"></div>`;
      const labelClasses = `label ${style} free${editable ? " editor-label" : ""}`;
      const maybeHidden = id => (elementLayout[id]?.visible === false ? " hidden" : "");
      const barcodeHidden = !fields.showBarcode.checked || elementLayout.barcode?.visible === false ? " hidden" : "";
      const grid = editable ? `<div class="editor-grid" aria-hidden="true"></div>` : "";
      return `
        <article class="${labelClasses}" style="left:${x}mm;top:${y}mm" aria-label="ეტიკეტი ${index + 1}">
          ${grid}
          <div class="label-item image-box${selectedClass("image", editable)}${maybeHidden("image")}" data-element="image" style="${itemStyle("image")}">${img}</div>
          <div class="label-item name${selectedClass("name", editable)}${maybeHidden("name")}" data-element="name" style="${itemStyle("name")}">${escapeText(fields.brandName.value)}</div>
          <div class="label-item sub${selectedClass("subtitle", editable)}${maybeHidden("subtitle")}" data-element="subtitle" style="${itemStyle("subtitle")}">${escapeText(fields.subtitle.value)}</div>
          <div class="label-item price${selectedClass("price", editable)}${maybeHidden("price")}" data-element="price" style="${itemStyle("price")}">${escapeText(fields.price.value)}</div>
          <div class="label-item sub${selectedClass("sku", editable)}${maybeHidden("sku")}" data-element="sku" style="${itemStyle("sku")}">${escapeText(fields.sku.value)}</div>
          <div class="label-item barcode-row${selectedClass("barcode", editable)}${barcodeHidden}" data-element="barcode" style="${itemStyle("barcode")}">
            <svg class="barcode" data-value="${escapeText(fields.barcodeValue.value)}"></svg>
            <div class="barcode-value">${escapeText(fields.barcodeValue.value)}</div>
          </div>
        </article>`;
    }

    function renderLabel(index, x, y) {
      if (isFreeLayout()) {
        return renderFreeLabel(index, x, y, fields.previewMode.value === "editor");
      }
      const style = fields.style.value;
      const img = uploadedImage
        ? `<img src="${uploadedImage}" alt="">`
        : `<div class="image-placeholder" aria-hidden="true"></div>`;
      const showBarcode = fields.showBarcode.checked;
      return `
        <article class="label ${style}" style="left:${x}mm;top:${y}mm;padding:${num("padding")}mm" aria-label="ეტიკეტი ${index + 1}">
          <div class="image-box">${img}</div>
          <div class="copy">
            <div class="name">${escapeText(fields.brandName.value)}</div>
            <div class="sub">${escapeText(fields.subtitle.value)}</div>
            <div class="meta">
              <span class="price">${escapeText(fields.price.value)}</span>
              <span>${escapeText(fields.sku.value)}</span>
            </div>
          </div>
          <div class="barcode-row" ${showBarcode ? "" : "hidden"}>
            <svg class="barcode" data-value="${escapeText(fields.barcodeValue.value)}"></svg>
            <div class="barcode-value">${escapeText(fields.barcodeValue.value)}</div>
          </div>
        </article>`;
    }

    function drawBarcodes() {
      document.querySelectorAll(".barcode").forEach(svg => {
        const value = svg.dataset.value || "0";
        try {
          JsBarcode(svg, value, {
            format: fields.barcodeFormat.value,
            width: 1.2,
            height: Math.max(18, num("barcodeHeight") * 3.3),
            displayValue: false,
            margin: 0,
            lineColor: fields.labelInk.value
          });
          errorText.textContent = "";
        } catch (error) {
          svg.replaceChildren();
          errorText.textContent = "შტრიხკოდის მნიშვნელობა არჩეულ ტიპს არ შეესაბამება.";
        }
      });
    }

    function selectElement(id) {
      if (!elementLayout[id]) return;
      selectedElementId = id;
      fields.activeElement.value = id;
      syncElementControls();
      document.querySelectorAll(".label-item").forEach(item => {
        item.classList.toggle("is-selected", item.dataset.element === id && fields.previewMode.value === "editor");
      });
    }

    function updateItemStyle(target, item) {
      target.style.setProperty("--item-x", `${item.x}mm`);
      target.style.setProperty("--item-y", `${item.y}mm`);
      target.style.setProperty("--item-w", `${item.w}mm`);
      target.style.setProperty("--item-h", `${item.h}mm`);
    }

    function mmScaleFor(target) {
      const label = target.closest(".label");
      const rect = label.getBoundingClientRect();
      return {
        x: num("labelWidth") / rect.width,
        y: num("labelHeight") / rect.height
      };
    }

    function initInteractions() {
      if (interactReady || !window.interact) return;
      interactReady = true;
      interact(".editor-label .label-item")
        .draggable({
          listeners: {
            start(event) {
              selectElement(event.target.dataset.element);
            },
            move(event) {
              const id = event.target.dataset.element;
              const item = elementLayout[id];
              const scale = mmScaleFor(event.target);
              item.x = clamp(item.x + event.dx * scale.x, 0, Math.max(0, num("labelWidth") - item.w));
              item.y = clamp(item.y + event.dy * scale.y, 0, Math.max(0, num("labelHeight") - item.h));
              updateItemStyle(event.target, item);
              syncElementControls();
            }
          }
        })
        .resizable({
          edges: { left: true, right: true, bottom: true, top: true },
          listeners: {
            start(event) {
              selectElement(event.target.dataset.element);
            },
            move(event) {
              const id = event.target.dataset.element;
              const item = elementLayout[id];
              const scale = mmScaleFor(event.target);
              item.x = clamp(item.x + event.deltaRect.left * scale.x, 0, Math.max(0, num("labelWidth") - 2));
              item.y = clamp(item.y + event.deltaRect.top * scale.y, 0, Math.max(0, num("labelHeight") - 2));
              item.w = clamp(event.rect.width * scale.x, 2, Math.max(2, num("labelWidth") - item.x));
              item.h = clamp(event.rect.height * scale.y, 2, Math.max(2, num("labelHeight") - item.y));
              updateItemStyle(event.target, item);
              syncElementControls();
              drawBarcodes();
            }
          },
          modifiers: [
            interact.modifiers.restrictEdges({ outer: "parent" }),
            interact.modifiers.restrictSize({ min: { width: 16, height: 12 } })
          ]
        });
    }

    function desiredLabelCount(fallback) {
      const count = Math.floor(num("labelQuantity"));
      return clamp(count || fallback || 1, 1, 10000);
    }

    function renderSheetPage(labels, pageIndex, editing) {
      const idAttr = pageIndex === 0 ? ' id="sheet"' : "";
      const editorClass = editing ? " editor-sheet" : "";
      return `
        <div${idAttr} class="sheet${editorClass}" aria-label="ეტიკეტების ფურცელი ${pageIndex + 1}">
          <div class="print-area">${labels.join("")}</div>
        </div>`;
    }

    function render() {
      const g = gridFromMeasurements();
      elementLayout = fitLayoutToLabel(elementLayout, g);
      applySizingVars(g);
      const editing = fields.previewMode.value === "editor";
      const capacity = Math.max(0, g.cols * g.rows);
      const requestedCount = editing ? 1 : desiredLabelCount(capacity);
      const pageCount = editing ? 1 : (capacity > 0 ? Math.max(1, Math.ceil(requestedCount / capacity)) : 1);
      if (editing) {
        fields.freeLayout.checked = true;
      }
      previewWrap.classList.toggle("editor-mode", editing);
      fields.cols.disabled = fields.autoGrid.checked;
      fields.rows.disabled = fields.autoGrid.checked;
      fields.freeLayout.disabled = editing;
      if (fields.autoGrid.checked) {
        fields.cols.value = g.cols;
        fields.rows.value = g.rows;
      }

      const distribution = sheetDistribution(g);
      const totalW = num("marginLeft") + num("marginRight") + distribution.x.used;
      const totalH = num("marginTop") + num("marginBottom") + distribution.y.used;
      const doesFit = g.cols > 0 && g.rows > 0 && totalW <= g.pageW + .01 && totalH <= g.pageH + .01;
      statusText.textContent = doesFit
        ? `ზომები ეტევა ფურცელზე · ${pageCount} გვერდი`
        : "ზომები არ ეტევა ფურცელზე";
      if (!doesFit && !errorText.textContent) {
        errorText.textContent = "შეამცირე ეტიკეტი, დაშორება ან კიდეებიდან მანძილი.";
      } else if (doesFit && !errorText.textContent.includes("შტრიხკოდის")) {
        errorText.textContent = "";
      }

      const pages = [];
      if (editing) {
        pages.push(renderSheetPage([renderFreeLabel(0, 0, 0, true)], 0, true));
      } else {
        let printedCount = 0;
        for (let pageIndex = 0; pageIndex < pageCount; pageIndex += 1) {
          const labels = [];
          for (let slot = 0; slot < capacity && printedCount < requestedCount; slot += 1) {
            const row = Math.floor(slot / g.cols);
            const col = slot % g.cols;
            const x = distribution.x.start + col * (g.w + distribution.x.gap);
            const y = distribution.y.start + row * (g.h + distribution.y.gap);
            labels.push(renderLabel(printedCount, x, y));
            printedCount += 1;
          }
          pages.push(renderSheetPage(labels, pageIndex, false));
        }
      }
      sheetsHost.innerHTML = pages.join("");
      drawBarcodes();
      selectElement(selectedElementId);
      initInteractions();

      countMetric.textContent = editing ? "1" : String(requestedCount);
      sizeMetric.textContent = `${g.w.toFixed(1)} × ${g.h.toFixed(1)}`;
      gridMetric.textContent = `${g.cols} × ${g.rows} / ${pageCount} გვ.`;
      const zoom = num("zoom");
      document.querySelectorAll(".sheet").forEach(page => {
        page.style.transform = `scale(${zoom / 100})`;
        page.style.marginBottom = `${g.pageH * ((zoom / 100) - 1)}mm`;
      });
      zoomValue.textContent = `${zoom}%`;
    }

    const layoutControlIds = new Set(["previewMode", "activeElement", "elemX", "elemY", "elemW", "elemH", "elemVisible"]);
    document.querySelectorAll("input, select").forEach(control => {
      if (layoutControlIds.has(control.id)) return;
      control.addEventListener("input", render);
      control.addEventListener("change", render);
    });

    fields.previewMode.addEventListener("change", () => {
      if (fields.previewMode.value === "editor") {
        fields.freeLayout.checked = true;
      }
      render();
    });
    fields.activeElement.addEventListener("change", () => {
      syncElementControls();
      render();
    });
    ["elemX", "elemY", "elemW", "elemH", "elemVisible"].forEach(id => {
      fields[id].addEventListener("input", () => {
        updateActiveLayoutFromControls();
        render();
      });
      fields[id].addEventListener("change", () => {
        updateActiveLayoutFromControls();
        render();
      });
    });
    sheetsHost.addEventListener("click", event => {
      const item = event.target.closest(".label-item");
      if (item && fields.previewMode.value === "editor") {
        selectElement(item.dataset.element);
      }
    });

    fields.presetSelect.addEventListener("change", () => applyPreset(fields.presetSelect.value));
    fields.presetName.addEventListener("input", () => {
      presetNote.textContent = "";
    });
    fields.productSelect.addEventListener("change", () => applyProduct(fields.productSelect.value));
    fields.productName.addEventListener("input", () => {
      productNote.textContent = "";
    });
    productButtons.save.addEventListener("click", saveProduct);
    productButtons.update.addEventListener("click", updateProduct);
    productButtons.delete.addEventListener("click", deleteProduct);
    presetButtons.save.addEventListener("click", savePreset);
    presetButtons.update.addEventListener("click", updatePreset);
    presetButtons.delete.addEventListener("click", deletePreset);
    titleSizeButtons.down.addEventListener("click", () => {
      fields.titleSize.value = clamp(num("titleSize") - 0.5, 3, 24).toFixed(1);
      render();
    });
    titleSizeButtons.up.addEventListener("click", () => {
      fields.titleSize.value = clamp(num("titleSize") + 0.5, 3, 24).toFixed(1);
      render();
    });
    priceSizeButtons.down.addEventListener("click", () => {
      fields.priceSize.value = clamp(num("priceSize") - 0.5, 2, 18).toFixed(1);
      render();
    });
    priceSizeButtons.up.addEventListener("click", () => {
      fields.priceSize.value = clamp(num("priceSize") + 0.5, 2, 18).toFixed(1);
      render();
    });

    document.querySelectorAll(".swatch").forEach(button => {
      button.addEventListener("click", () => {
        const selected = palettes[button.dataset.palette];
        fields.accentColor.value = selected.accent;
        fields.labelInk.value = selected.ink;
        syncPaletteButtons();
        render();
      });
    });

    fields.imageInput.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) {
        uploadedImage = "";
        render();
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        uploadedImage = reader.result;
        productNote.textContent = "ფოტო დაემატა; პროდუქტის შესანახად დააჭირე პროდუქტის დამატება ან განახლება.";
        render();
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("printBtn").addEventListener("click", () => {
      const previousMode = fields.previewMode.value;
      fields.previewMode.value = "all";
      render();
      window.print();
      fields.previewMode.value = previousMode;
      render();
    });
    syncElementControls();
    populateProductSelect();
    populatePresetSelect();
    applyProduct(window.localStorage.getItem(ACTIVE_PRODUCT_KEY) || activeProductId || products[0]?.id, false);
    applyPreset(window.localStorage.getItem(ACTIVE_PRESET_KEY) || activePresetId || stylePresets[0]?.id, false);
  </script>
</body>
</html>
